<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="0JB0J7vAo9VXiZCWRKl-VXM6QkVJ7U3efMdqetsZt7M" />
<title>Mind Master</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
width:90%;
max-width:400px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 0 20px cyan;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00e5ff;
font-weight:bold;
margin-top:15px;
}

#game{
display:none;
}

.grid{
display:grid;
grid-template-columns:repeat(3,90px);
gap:10px;
justify-content:center;
margin-top:20px;
}

.box{
width:90px;
height:90px;
background:#2196f3;
border-radius:12px;
cursor:pointer;
}

.diff{
background:#ff1744;
}
</style>
</head>
<body>

<div class="card" id="menu">
    <h1>🧠 Mind Master</h1>
    <p>Find the different coloured box.</p>

    <button onclick="startGame()">START</button>
</div>

<div class="card" id="game">
    <h2>Level <span id="level">1</span></h2>

    <p>Score: <span id="score">0</span></p>

    <p>High Score: <span id="highScore">0</span></p>

    <button onclick="restartGame()">Restart</button>

    <div class="grid" id="grid"></div>
</div>

<script>
let score = 0;
let level = 1;
let highScore = localStorage.getItem("highScore") || 0;

document.getElementById("highScore").innerText = highScore;

function startGame() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";
    createGrid();
}

function createGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const random = Math.floor(Math.random() * 9);

    for (let i = 0; i < 9; i++) {
        const box = document.createElement("div");
        box.className = "box";

        if (i === random) {
            box.classList.add("diff");
        }

        box.onclick = function () {
            if (i === random) {
                score += 10;

                if (score % 50 === 0) {
                    level++;
                }

                document.getElementById("score").innerText = score;
                document.getElementById("level").innerText = level;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("highScore", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }

                createGrid();
            } else {
                alert("Wrong! Try Again");
            }
        };

        grid.appendChild(box);
    }
}

function restartGame() {
    score = 0;
    level = 1;

    document.getElementById("score").innerText = score;
    document.getElementById("level").innerText = level;

    createGrid();
        }
    </script>

</body>
</html>
